name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version without the v prefix, for example 1.8.0"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    env:
      REPO: kamilpopowicz/PasswordMonitor
      APP_SCHEME: PasswordMonitor
      CORE_SCHEME: PasswordMonitorCore
      RELEASE_ARTIFACT_DIR: /private/tmp/PasswordMonitorReleaseArtifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RELEASE_VERSION="${{ inputs.release_version }}"
            TAG_NAME="v${RELEASE_VERSION}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            RELEASE_VERSION="${TAG_NAME#v}"
          fi

          MARKETING_VERSION="$(xcodebuild -project PasswordMonitor.xcodeproj -scheme "${APP_SCHEME}" -showBuildSettings 2>/dev/null | awk -F ' = ' '/MARKETING_VERSION = / {gsub(/^[[:space:]]+/, "", $2); print $2; exit}')"

          if [[ -z "${MARKETING_VERSION}" ]]; then
            echo "Unable to resolve MARKETING_VERSION."
            exit 1
          fi

          if [[ "${TAG_NAME}" != v* ]]; then
            echo "Release tag ${TAG_NAME} must start with v."
            exit 1
          fi

          if [[ "${RELEASE_VERSION}" != "${MARKETING_VERSION}" ]]; then
            echo "Tag version ${RELEASE_VERSION} does not match MARKETING_VERSION ${MARKETING_VERSION}."
            exit 1
          fi

          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Run tests
        run: xcodebuild test -project PasswordMonitor.xcodeproj -scheme "${CORE_SCHEME}" -destination 'platform=macOS' -derivedDataPath /private/tmp/PasswordMonitorDerivedData CODE_SIGNING_ALLOWED=NO ENABLE_PREVIEWS=NO

      - name: Build release app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project PasswordMonitor.xcodeproj \
            -scheme "${APP_SCHEME}" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath /private/tmp/PasswordMonitorReleaseDerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Ad hoc sign app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="/private/tmp/PasswordMonitorReleaseDerivedData/Build/Products/Release/PasswordMonitor.app"
          codesign --force --sign - --timestamp=none --deep "${APP_PATH}"
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"

      - name: Package release artifacts
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="/private/tmp/PasswordMonitorReleaseDerivedData/Build/Products/Release/PasswordMonitor.app"
          ARTIFACT_DIR="${RELEASE_ARTIFACT_DIR}"
          mkdir -p "${ARTIFACT_DIR}"

          ZIP_PATH="${ARTIFACT_DIR}/PasswordMonitor.app.zip"
          HASH_PATH="${ARTIFACT_DIR}/PasswordMonitor.app.zip.sha256"
          NOTES_PATH="${ARTIFACT_DIR}/release-notes.md"

          ditto -c -k --keepParent "${APP_PATH}" "${ZIP_PATH}"
          shasum -a 256 "${ZIP_PATH}" | awk '{print $1}' > "${HASH_PATH}"

          awk -v release="## PasswordMonitor ${{ steps.version.outputs.release_version }}" '
            $0 == release { capture=1; next }
            capture && /^##[[:space:]]/ { exit }
            capture { print }
          ' changelog.md > "${NOTES_PATH}"

          if [[ ! -s "${NOTES_PATH}" ]]; then
            echo "Release notes are empty for ${{ steps.version.outputs.release_version }}."
            exit 1
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: passwordmonitor-release-${{ steps.version.outputs.release_version }}
          path: /private/tmp/PasswordMonitorReleaseArtifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: macos-latest
    environment:
      name: release-signing
    permissions:
      contents: write
    env:
      REPO: kamilpopowicz/PasswordMonitor
      APP_SCHEME: PasswordMonitor
      RELEASE_ARTIFACT_DIR: /private/tmp/PasswordMonitorReleaseArtifacts
      UPDATE_MANIFEST_KEY_ID: passwordmonitor-2026-05
      UPDATE_MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: passwordmonitor-release-${{ needs.build.outputs.release_version }}
          path: /private/tmp/PasswordMonitorReleaseArtifacts

      - name: Sign manifest
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${RELEASE_ARTIFACT_DIR}"
          HASH_PATH="${ARTIFACT_DIR}/PasswordMonitor.app.zip.sha256"
          MANIFEST_PATH="${ARTIFACT_DIR}/PasswordMonitor.update-manifest.json"
          NOTES_PATH="${ARTIFACT_DIR}/release-notes.md"

          SWIFT_TOOL="${GITHUB_WORKSPACE}/scripts/generate_update_manifest.swift"
          swift "${SWIFT_TOOL}" \
            --version "${{ needs.build.outputs.release_version }}" \
            --asset-name PasswordMonitor.app.zip \
            --bundle-id popo.PasswordMonitor \
            --sha256 "$(cat "${HASH_PATH}")" \
            --key-id "${UPDATE_MANIFEST_KEY_ID}" \
            --output "${MANIFEST_PATH}"

          if [[ ! -s "${MANIFEST_PATH}" ]]; then
            echo "Manifest generation failed."
            exit 1
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${RELEASE_ARTIFACT_DIR}"
          ZIP_PATH="${ARTIFACT_DIR}/PasswordMonitor.app.zip"
          HASH_PATH="${ARTIFACT_DIR}/PasswordMonitor.app.zip.sha256"
          MANIFEST_PATH="${ARTIFACT_DIR}/PasswordMonitor.update-manifest.json"
          NOTES_PATH="${ARTIFACT_DIR}/release-notes.md"
          TAG_NAME="${{ needs.build.outputs.tag_name }}"
          RELEASE_TITLE="PasswordMonitor ${TAG_NAME#v}"

          if gh release view "${TAG_NAME}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --repo "${REPO}" \
              --title "${RELEASE_TITLE}" \
              --notes-file "${NOTES_PATH}" \
              --verify-tag
          else
            gh release create "${TAG_NAME}" \
              --repo "${REPO}" \
              --title "${RELEASE_TITLE}" \
              --notes-file "${NOTES_PATH}" \
              --verify-tag
          fi

          gh release upload "${TAG_NAME}" \
            --repo "${REPO}" \
            --clobber \
            "${ZIP_PATH}" \
            "${HASH_PATH}" \
            "${MANIFEST_PATH}"
